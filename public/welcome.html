<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in…</title>
<!--
  Asgardeo's Access URL points here, NOT at /welcome.

  The registration flow's countdown never clears its interval, so once it hits
  zero it re-assigns window.location.href every second (react-ui-core.min.js).
  Re-assigning cancels the in-flight navigation, and a 307 chain keeps the old
  document on screen the whole time, so anything slower than ~1s is restarted
  forever. /welcome -> /api/sign-in -> Asgardeo takes 3.5-5.8s and never lands.

  A static file off the CDN answers 200 in ~0.3s. That commits the browser to a
  new document, which destroys the Asgardeo page and its interval - after which
  the hop to /api/sign-in has no deadline.
-->
<meta http-equiv="refresh" content="0;url=/api/sign-in">
<script>location.replace('/api/sign-in')</script>
<style>
  :root { color-scheme: light dark; --bg: oklch(0.985 0.006 292); --fg: oklch(0.505 0.030 287); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: oklch(0.165 0.022 285); --fg: oklch(0.705 0.028 288); }
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
</style>
<body>
  <p>Signing you in…</p>
  <noscript><a href="/api/sign-in" style="color:inherit">Continue to sign in</a></noscript>
</body>
